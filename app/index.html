<!DOCTYPE html>
<html lang="en" data-server-base="https://frogtab.com/" data-save="browser" data-theme="system">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Frogtab is a lightweight task manager that helps you stay focused on today's priorities">
    <title>Frogtab</title>
    <link rel="icon" href="favicons/icon-16.png" sizes="16x16" type="image/png" id="icon16">
    <link rel="icon" href="favicons/icon-32.png" sizes="32x32" type="image/png" id="icon32">
    <link rel="apple-touch-icon" sizes="180x180" href="favicons/icon-180-apple.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css?sha1=eeb5e88937519bf75739985a58cf0428b6e6cc0b">
  </head>
  <body>
    <div id="container" class="container">
      <div class="interface">
        <a tabindex="0" id="welcome" class="popup" href="help#overview-of-frogtab" target="_blank">
          Welcome to Frogtab! Get started
          <svg role="img" aria-label="Arrow icon" width="20px" height="20px" stroke-width="1.5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" color="currentColor"><path d="M3 12L21 12M21 12L12.5 3.5M21 12L12.5 20.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </a>
        <a tabindex="0" id="popup-save-failed" class="popup" href="help#restoring-your-data" target="_blank">
          To pair with Frogtab Local, restore from a backup
          <svg role="img" aria-label="Arrow icon" width="20px" height="20px" stroke-width="1.5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" color="currentColor"><path d="M3 12L21 12M21 12L12.5 3.5M21 12L12.5 20.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </a>
        <div id="popup-save-paused" class="popup">
          <svg role="img" aria-label="Warning icon" width="20px" height="20px" stroke-width="1.5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" color="currentColor"><path d="M20.043 21H3.957c-1.538 0-2.5-1.664-1.734-2.997l8.043-13.988c.77-1.337 2.699-1.337 3.468 0l8.043 13.988C22.543 19.336 21.58 21 20.043 21zM12 9v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path><path d="M12 17.01l.01-.011" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>Unable to connect to Frogtab Local
        </div>
        <div class="tabs">
          <div class="tab">
            <span tabindex="-1" id="tab-today" class="tab-name selected">Today</span>
            <span tabindex="0" id="tab-inbox" class="tab-name">Inbox</span>
            <span class="tab-icon">⬤</span>
          </div>
          <div class="tab info">
            <span id="tab-info" class="info-message">Your inbox is all set!</span>
            <span id="fetch-connected" class="info-message" title="Ready to receive tasks from any device"><svg role="img" aria-label="Cloud icon" width="20px" height="20px" stroke-width="1.5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" color="currentColor"><path d="M12 4c-6 0-6 4-6 6-1.667 0-5 1-5 5s3.333 5 5 5h12c1.667 0 5-1 5-5s-3.333-5-5-5c0-2 0-6-6-6z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path></svg></span>
          </div>
        </div>
        <div class="main">
          <textarea tabindex="0" aria-labelledby="tab-today" id="editor-today" class="display"></textarea>
          <textarea tabindex="0" aria-labelledby="tab-inbox" id="editor-inbox"></textarea>
        </div>
        <div class="actions">
          <div class="action">
            <a tabindex="0" id="menu-button" class="action-instruction display" title="Menu" href="#"><svg role="img" aria-label="Menu icon" width="20px" height="20px" stroke-width="1.5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" color="currentColor"><path d="M3 5h18M3 12h18M3 19h18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
            <div id="menu" class="action-menu">
            <a tabindex="0" data-menu-seq="0" class="action-menu-item display clickable" href="help" target="_blank">Help &amp; Privacy</a>
            <a tabindex="0" data-menu-seq="1" id="export-data" class="action-menu-item display clickable" href="#" download="Frogtab_backup.json">Export My Data</a>
            <a tabindex="0" data-menu-seq="2" class="action-menu-item display clickable divider" href="week" target="_blank">Weekly Routine</a>
            <a tabindex="0" data-menu-seq="3" class="action-menu-item display clickable" href="achievements" target="_blank">Achievements</a>
            <a tabindex="0" data-menu-seq="4" id="snap-to-bottom" class="action-menu-item display clickable divider" href="#">Snap to Bottom</a>
            <a tabindex="0" data-menu-seq="4" id="snap-to-center" class="action-menu-item clickable" href="#">Snap to Center</a>
            <div class="action-menu-item display theme-row">
              <a tabindex="0" data-menu-seq="5" id="theme-light" class="action-menu-item display clickable" href="#" title="Use light theme"><svg role="img" aria-label="Sun icon" width="20px" height="20px" stroke-width="1.5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" color="currentColor"><path d="M12 18C15.3137 18 18 15.3137 18 12C18 8.68629 15.3137 6 12 6C8.68629 6 6 8.68629 6 12C6 15.3137 8.68629 18 12 18Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M22 12L23 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M12 2V1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M12 23V22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M20 20L19 19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M20 4L19 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M4 20L5 19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M4 4L5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M1 12L2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
              <a tabindex="0" data-menu-seq="6" id="theme-dark" class="action-menu-item display clickable" href="#" title="Use dark theme"><svg role="img" aria-label="Moon icon" width="20px" height="20px" stroke-width="1.5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" color="currentColor"><path d="M3 11.5066C3 16.7497 7.25034 21 12.4934 21C16.2209 21 19.4466 18.8518 21 15.7259C12.4934 15.7259 8.27411 11.5066 8.27411 3C5.14821 4.55344 3 7.77915 3 11.5066Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
              <a tabindex="0" data-menu-seq="7" id="theme-system" class="action-menu-item display clickable" href="#" title="Use system theme"><svg role="img" aria-label="Computer icon" width="20px" height="20px" stroke-width="1.5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" color="currentColor"><path d="M2 21L17 21" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></path><path d="M21 21L22 21" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></path><path d="M2 16.4V3.6C2 3.26863 2.26863 3 2.6 3H21.4C21.7314 3 22 3.26863 22 3.6V16.4C22 16.7314 21.7314 17 21.4 17H2.6C2.26863 17 2 16.7314 2 16.4Z" stroke="currentColor" stroke-width="1.5"></path></svg></a>
            </div>
            </div>
            <a tabindex="0" id="enable-save" class="action-instruction" href="#">Enable Auto-Backup</a>
          </div>
        </div>
      </div>
    </div>
    <script src="main.js?sha1=3fee4a18557a5936f840c86be94310923fdd50c7"></script>
  </body>
</html>
